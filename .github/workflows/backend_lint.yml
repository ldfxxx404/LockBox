name: Linting-backend

on:
  push:
    branches-ignore:
      - main
      - chore/**
      - fix/**
      - feat/**
      - refactor/**
      - docs/**

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '^1.24.1'

      - name: Install dependencies
        run: |
          cd backend
          go mod download

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.12.2
          working-directory: backend

      - name: Check formatting (gofmt)
        run: |
          cd backend
          test -z "$(gofmt -l .)"

      - name: Run tests
        run: |
          cd backend
          go test -race ./...

      - name: Build project
        run: |
          cd backend
          go build -v ./cmd/lock_box
